<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitBranch Lens &bull; Divergence &amp; Collapsed Commit Viewer</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-icon">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"></path>
        </svg>
      </div>
      <div>
        <div class="brand-title">GitBranch Lens</div>
        <div class="brand-desc">Branch Divergence &amp; Commit Viewer</div>
      </div>
    </div>

    <div class="header-controls">
      <div class="input-group">
        <label for="repo-input">Repo</label>
        <input type="text" id="repo-input" placeholder="owner/repo (e.g. herdrdev/herdr)" spellcheck="false" autocomplete="off">
      </div>

      <div class="input-group">
        <label for="pat-input">Token</label>
        <input type="password" id="pat-input" placeholder="GitHub PAT (optional)" spellcheck="false" autocomplete="off" title="Stored in session storage only">
      </div>

      <button class="btn btn-primary" id="btn-load-repo">Load</button>
      <button class="btn btn-secondary" id="btn-load-demo" title="Load offline demo repository">Load Demo</button>
    </div>
  </header>

  <!-- Sub-Toolbar: Branches, Global Search & Actions -->
  <div class="sub-toolbar">
    <div class="branch-chips-area" id="branch-chips-area">
      <!-- Injected branch pills -->
    </div>

    <!-- Global Find Commit Tool -->
    <div class="search-toolbar-group">
      <div class="global-search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
          <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
        </svg>
        <input type="text" id="global-search-input" placeholder="Find commit globally... [/]" autocomplete="off" spellcheck="false">
        <button class="search-clear-btn" id="btn-clear-global-search" style="display:none;" title="Clear search">&times;</button>
        <span class="search-kbd-hint">/</span>
      </div>
      <div class="search-nav-controls" id="search-nav-controls" style="display:none;">
        <span class="search-match-count" id="search-match-count">0 matches</span>
        <button class="btn-search-nav" id="btn-prev-match" title="Previous match (Shift+Enter)">&uarr;</button>
        <button class="btn-search-nav" id="btn-next-match" title="Next match (Enter)">&darr;</button>
      </div>
    </div>

    <div class="graph-actions">
      <div class="rate-limit-pill" id="rate-limit-pill" style="display: none;">
        <!-- Injected rate limit -->
      </div>

      <!-- View Mode: Smart vs All Commits -->
      <div class="toggle-group" id="filter-mode-group">
        <button class="toggle-btn active" id="btn-mode-smart" title="Collapse linear intermediate commits">Smart</button>
        <button class="toggle-btn" id="btn-mode-all" title="Show every individual commit">All Commits</button>
      </div>

      <!-- Depth Selector -->
      <div class="depth-selector-group">
        <label for="commit-depth-select">Fetch:</label>
        <select id="commit-depth-select" class="depth-select" title="Number of commits to fetch per branch">
          <option value="30">30</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>

      <div class="toggle-group">
        <button class="toggle-btn" id="btn-collapse-all" title="Collapse linear intermediate commits">Fold All</button>
        <button class="toggle-btn" id="btn-expand-all" title="Expand all commit chains">Expand All</button>
      </div>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="main-layout">
    <div class="viewport">
      <div class="repo-meta-bar" id="repo-meta-bar">
        <span class="repo-meta-name" id="status-text">demo-repo (3 branches)</span>
        <span class="repo-meta-hint">Smart collapsed: branch tips &amp; divergence points visible</span>
      </div>

      <div id="graph-viewport">
        <!-- Injected graph nodes -->
      </div>
    </div>

    <!-- Slide-Over Commit Inspector Drawer -->
    <aside class="inspector-drawer" id="inspector-drawer">
      <!-- Injected commit details -->
    </aside>
  </main>

  <!-- Branch Picker Modal -->
  <div class="modal-overlay" id="branch-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h4 style="font-size:14px; font-weight:600;">Select Branches to View</h4>
        <button class="btn-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" class="branch-search-input" id="modal-branch-search" placeholder="Filter branches (e.g. main, dev, feature)...">
        <div id="modal-branch-list" style="display:flex; flex-direction:column; gap:4px;">
          <!-- Branch items -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
